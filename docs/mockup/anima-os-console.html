 function clear(){
  version++;
  snapshot=undefined;
  loading=false;
  attentionVersion++;
  attention=undefined;
  sawWaiting=false;
  checking=false;
 }
 async function refreshAttention(call,changed){
  if(checking)return;
  const request=++attentionVersion;
  checking=true;
  const next=await call('code-attention').catch(()=>null);
  if(request!==attentionVersion)return;
  checking=false;
  if(JSON.stringify(attention)===JSON.stringify(next))return;
  attention=next;
  if(next?.complete||next?.entries.length)sawWaiting=next.entries.length>0;

 }
 function waitingLabel(count){
  return count===1?'1 coding session is waiting for a response':count+' coding sessions are waiting for a response';
 }
 function overview(pageLink){
  const total=attention?.entries.reduce((sum,entry)=>sum+entry.waitingThreads,0);
  if(!total&&!sawWaiting)return '';
  const detail=total
   ? waitingLabel(total)+(attention.complete?'':' · Some workspaces could not be checked')
   : 'A previous check found a waiting session · Current status unavailable';
  return '<div class="notice">'+pageLink('Activity','Needs you',detail)+'</div>';
 }
 function updateAttention(page,escape,pageLink){
  const summary=page.querySelector('.page-content [data-attention-overview]');
  const details=page.querySelector('.page-content [data-attention-details]');

  if(details)details.innerHTML=attentionDetails(escape);
 }
 function attentionDetails(escape){
  const heading='<h2>Needs you</h2>';
  if(attention===undefined)return heading+'<p role="status">Checking for coding sessions that need a response…</p>';
  if(attention===null)return heading+'<p class="notice warning" role="status">Coding session status is unavailable.</p>';
  const rows=attention.entries.map(entry=>`<div class="row"><div class="row-title"><div><strong title="${escape(entry.workspace)}">Workspace ${escape(entry.workspace.slice(0,8))}</strong><small>Generation ${escape(entry.generation)}</small></div></div><span class="value">${waitingLabel(entry.waitingThreads)}</span></div>`).join('');

  if(loading)return;
  const request=++version;
  loading=true;

 function eventRow(event,escape){

  if(!history)return '<p class="notice warning" role="status">Local action history is unavailable.</p>';

  const warning=history.complete?'':'<p class="notice warning" role="status">Some local actions could not be recorded.</p>';

    }

    function revertCountdown(deadline, expired) {
      const count = overlay.querySelector('#revert-count');
      timer = setInterval(() => {
        const seconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
        if (seconds === 0) {
          close();
          expired();
        }
        else count.textContent = `Reverting in ${seconds} seconds.`;
      }, 200);
    }

    function tabStops() {
      return [...overlay.querySelectorAll('button,input,select,textarea,a[href],[tabindex]')]
        .filter(element => element.tabIndex >= 0 && !element.matches(':disabled') && element.checkVisibility());
    }

    overlay.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !closing && canDismiss() && !overlay.querySelector('#revert-count')) close();
      if (event.key !== 'Tab') return;
      const controls = closing ? [] : tabStops();
      const first = controls[0], last = controls.at(-1);
      const from = event.shiftKey ? first : last;
      const to = event.shiftKey ? last : first;

const AnimaMaintenance = {
  create({call, dialog, unlocked, row, button, esc, changed}) {
    const power = new Map([
      ['restart', {title: 'Restart this computer?', label: 'Restart'}],
      ['shutdown', {title: 'Shut down this computer?', label: 'Shut down'}],
      ['update-activate', {title: 'Restart to apply the update?', label: 'Restart and update', update: 'activate'}],
      ['update-rollback', {title: 'Restart into the previous system?', label: 'Restart and roll back', update: 'rollback'}],
    ]);
    let reviewed = null;

    function control(label, action, target = '', primary = false) {
      return `<button class="${primary ? 'primary' : 'quiet'}" data-action="${action}" data-target="${esc(target)}">${label}</button>`;
    }

    function readableCount(value) {
      return Number.isSafeInteger(value) && value >= 0 ? String(value) : 'Unavailable';
    }

    function observations(impact) {
      const legacy = impact.legacyRunning;
      return row('Active reservations', 'Agent workspaces and builds', readableCount(impact.reservations))
        + row('Source build pipeline', 'Covers the handoff from source checkout to build',
          impact.sourceInProgress === true ? 'In progress' : impact.sourceInProgress === false ? 'Clear' : 'Unavailable')
        + row('Running Docker containers', 'Includes managed workspaces', readableCount(impact.runningDocker))
        + row('Legacy Podman workloads', 'Observed across local accounts', legacy === true ? 'Running' : legacy === false ? 'None observed' : 'Unavailable')
        + row('Hosting dispatch', 'Managed application operations', impact.hostingClear ? 'Clear' : 'In progress or needs review');
    }

    function drainActions(impact, target) {
      if (impact.pendingTransition) {
        return '<p>A previous maintenance request holds admission.</p>'
          + control('Review previous request', 'maintenance-status');
      }
      const scheduled = Number.isSafeInteger(impact.updateWindowEndsAt)
        ? '<p>The update window is holding new agent and build work. Hosted applications keep running until their owners stop them.</p>'
          + AnimaPresentation.pageLink('Updates', 'View activation window', '')
        : '';
      if (impact.drain) {
        return scheduled + '<p>New workspace and build reservations are paused. Accepted source builds and work with an active reservation can finish. Stop long-lived workspaces and applications through their owners before continuing.</p>'
          + `<button class="quiet" data-action="maintenance-drain-cancel" data-target="${esc(target)}" data-receipt="${esc(impact.drain.id)}">${scheduled ? 'Clear manual pause' : 'Resume new work'}</button>`;
      }
      if (scheduled) return scheduled;
      return '<p>Pause new workspace and build reservations while reserved work finishes. Hosted applications stay running until their owners stop them.</p>'
        + control('Pause new work', 'maintenance-drain-begin', target);
    }

    function updateSelection(action, status) {
      const revision = status?.review?.[action];
      if (!/^[a-f0-9]{64}$/.test(revision)) return null;
      if (action === 'activate' && status.phase === 'staged' && status.version) {
        return {revision, summary: row('Release', 'Verified update ready to install', esc(status.version))};
      }
      if (action === 'rollback' && typeof status.previous === 'string' && status.previous.startsWith('/nix/store/')) {
        return {revision, summary: row('Previous system', 'Rollback target', esc(status.previous.slice('/nix/store/'.length)))};
      }
      return null;
    }

    async function review(target = '') {
      const transition = power.get(target);
      const title = transition?.title ?? 'Maintenance';
      dialog.modal(title, '<p role="status">Checking running work…</p>', '');
      const version = dialog.version;
      const [impact, updateStatus] = await Promise.all([
        call('maintenance-impact'),
        transition?.update ? call('update-status') : null,
      ]);
      if (!unlocked() || version !== dialog.version) return;
      const selection = updateSelection(transition?.update, updateStatus);
      const awaitingUpdate = transition?.update && !selection;
      const note = awaitingUpdate ? '<p>The update selection is unavailable. Check OS updates again before restarting.</p>' : transition
        ? (impact.ready ? '<p>Workload checks passed. Remote access disconnects while this computer is offline.</p>'
          : '<p>Power changes are held until these checks clear.</p>')
        : '';
      const confirm = transition && impact.ready && !awaitingUpdate ? control(transition.label, 'power-confirm', target, true) : '';
      dialog.modal(title, (selection?.summary || '') + note + observations(impact) + drainActions(impact, target),
        button(transition ? 'Cancel' : 'Close', 'close') + control('Refresh status', 'maintenance-review', target) + confirm);
      reviewed = confirm ? {target, version: dialog.version, revision: selection?.revision} : null;
    }

    async function previous() {
      const version = dialog.version;
      const receipt = await call('maintenance-status');
      if (!unlocked() || version !== dialog.version) return;
      if (!receipt) {
        await review();
        return;
      }
      const body = '<p>A previous ' + esc(receipt.operation)
        + ' request has closed admission. Confirm the requested action did not take effect before releasing the receipt.</p>'
        + `<button class="quiet" data-action="maintenance-release" data-receipt="${esc(receipt.id)}">Reconcile and release</button>`;
      dialog.modal('Previous maintenance request', body, button('Close', 'close'));
    }

    async function update(action, target, id) {
      const version = dialog.version;
      await call(action, {id, confirmed: true});
      changed();
      if (unlocked() && version === dialog.version) await review(target);
    }

    async function dispatch(target) {
      const transition = power.get(target);
      if (!transition || reviewed?.target !== target || reviewed.version !== dialog.version) return;
      const args = {confirmed: true};
      if (reviewed.revision) args.reviewRevision = reviewed.revision;
      dialog.modal(transition.title, '<p>Checking workload state and requesting the power change…</p>', '');
      const version = dialog.version;
      await call(target, args);
      if (unlocked() && version === dialog.version) dialog.close(true);
    }

    return {
      handle(action, {target, receipt}) {
        switch (action) {
          case 'restart':
          case 'shutdown': return review(action);
          case 'update-restart': return review('update-activate');
          case 'update-rollback-prompt': return review('update-rollback');
          case 'maintenance-review': return review(target);
          case 'maintenance-status': return previous();
          case 'maintenance-release':
          case 'maintenance-drain-begin':
          case 'maintenance-drain-cancel': return update(action, target, receipt);
          case 'power-confirm': return dispatch(target);
          default: return null;
        }
      },
    };
  },
};

const AnimaPages = {
  create({main, animate, reduced, role}) {
    let page;
    let markup;

    function clear() {
      main.getAnimations({subtree: true}).forEach(animation => animation.cancel());
      main.replaceChildren();
      page = markup = undefined;
    }

    function restoreFocus(content, previous) {
      const attributes = ['id', 'name', 'data-action', 'data-page', 'data-container', 'data-attempt'];
      const identity = attributes.flatMap(attribute => previous.hasAttribute(attribute)
        ? [`[${attribute}="${CSS.escape(previous.getAttribute(attribute))}"]`] : []).join('');
      if (!identity && !previous.matches('h1,summary')) return;
      const target = content.querySelector(previous.localName + identity);
      target?.focus({preventScroll: true});
    }

    function show(destination, html) {
      const navigating = destination !== page;
      if (!navigating && html === markup) return;
      const previous = main.querySelector('.page-content');
      const focused = previous?.contains(document.activeElement) ? document.activeElement : null;
      const scroll = navigating ? 0 : main.scrollTop;
      const expanded = !navigating && previous?.querySelector('details')?.open;
      page = destination;
      markup = html;

      const content = document.createElement('div');
      content.className = 'page-content';
      content.innerHTML = html;
      if (navigating) main.querySelector('.page-outgoing')?.remove();
      if (previous && navigating && !reduced()) {
        const opacity = getComputedStyle(previous).opacity;
        previous.getAnimations().forEach(animation => animation.cancel());
        previous.className = 'page-outgoing';
        previous.inert = true;
        previous.setAttribute('aria-hidden', 'true');
        previous.querySelectorAll('[id]').forEach(element => element.removeAttribute('id'));
        animate(previous, [{opacity}, {opacity: 0}], role.fast).then(() => previous.remove());
        animate(content, [{opacity: 0}, {opacity: 1}]);
        main.append(content);
      } else if (previous) {
        previous.replaceWith(content);
      } else {
        main.append(content);
      }

      const details = content.querySelector('details');
      if (expanded && details) details.open = true;
      main.scrollTop = scroll;
      if (!navigating && focused) restoreFocus(content, focused);
    }

    return {clear, show};
  },
};

const AnimaDisplaySettings = {
  create({call, draw, active, escape}) {
    const {button, icon, subhead} = AnimaPresentation;
    const directions = {
      normal: 'Landscape',
      left: 'Portrait left',
      right: 'Portrait right',
      inverted: 'Landscape flipped',
    };
    let outputs;
    let selected;
    let revision = 0;

    function clear() {
      revision++;
      outputs = selected = undefined;
    }

    function reset() {
      document.getElementById('display-form')?.reset();
    }

    async function refresh() {
      const reading = ++revision;
      let observed;
      try {
        observed = await call('displays');
      } catch {
        observed = null;
      }
      if (reading !== revision) return;
      outputs = observed;
      if (!outputs?.some(output => output.name === selected)) selected = outputs?.[0]?.name;
      if (active()) {
        draw();
        reset();
      }
    }

    function select(name) {
      if (!active() || !outputs?.some(output => output.name === name)) return;
      selected = name;
      draw();
    }

    async function preview(form, dialog) {
      const reading = revision;
      const {output, rotation} = form.elements;
      const {revertSeconds} = await call('rotate', {output: output.value, rotation: rotation.value});
      if (reading !== revision || !active()) return;
      dialog.modal('Keep these display settings?',
        `<p id="revert-count">Reverting in ${escape(revertSeconds)} seconds.</p>`,
        button('Revert', 'revert') + button('Keep settings', 'keep-rotation', true));
      dialog.revertCountdown(Date.now() + revertSeconds * 1000, reset);
    }

    function orientationForm() {
      if (outputs === undefined) return '<p role="status">Reading displays…</p>';
      if (outputs === null) return '<p class="notice warning" role="status">Display information is unavailable. Return to Settings and try again.</p>';
      if (!outputs.length) return '<p role="status">No configurable display is available.</p>';
      const current = outputs.find(output => output.name === selected);
      const monitors = outputs.map(({name}) =>
        `<option value="${escape(name)}" ${name === selected ? 'selected' : ''}>${escape(name)}</option>`).join('');
      const rotations = Object.entries(directions).map(([value, label]) =>
        `<option value="${value}" ${value === current.rotation ? 'selected' : ''}>${label}</option>`).join('');
      return `<form id="display-form">
        <label>Display<select name="output">${monitors}</select></label>
        <label>Orientation<select name="rotation">${rotations}</select></label>
        <button class="primary">${icon('checkmark')}Apply display settings</button>
      </form><div class="notice">Unconfirmed changes revert after 15 seconds. Confirmed orientation is saved for future boots.</div>`;
    }

    function render(motionChoice) {
      return subhead('Display & accessibility', 'Keep this screen readable without interrupting background services.')
        + orientationForm()
        + `<label>Interface motion<select id="motion-choice">
          <option value="system" ${motionChoice === 'system' ? 'selected' : ''}>Follow system</option>
          <option value="reduced" ${motionChoice === 'reduced' ? 'selected' : ''}>Reduced motion</option>
        </select></label>
        <section class="section"><h2>Screen power</h2>
          <p>Turn the screen off and lock this console. Press a key, move the mouse or touch the screen to wake it. Background services keep running.</p>
          ${button('Turn screen off', 'screen-off')}
        </section>`;
    }

    return {clear, preview, refresh, render, select};
  },
};

const AnimaStorage = {
  create({call, redraw, escape, row, head, size}) {
    let volumes, reading = false, generation = 0;
    const states = {
      'not-mounted': 'Recorded filesystem is unmounted',
      'unexpected-mount': 'Unexpected filesystem mounted here',
      unavailable: 'Mount or capacity is unavailable',
    };

    function clear() {
      generation++;
      reading = false;
      volumes = undefined;
    }

    async function refresh() {
      if (reading) return;
      const request = ++generation;
      reading = true;
      redraw();
      const result = await call('data-volumes').catch(() => null);
      if (request !== generation) return;
      volumes = Array.isArray(result) ? result : null;
      reading = false;
      redraw();
    }

    function volumeRow(volume) {
      const name = volume.model || `Data volume ${volume.uuid.slice(0,8)}`;
      const path = `<code>${escape(volume.mountpoint)}</code>`;
      const capacity = volume.state === 'mounted' ? volume.capacity : null;
      const status = capacity
        ? `${size(capacity.available)} available of ${size(capacity.total)}<br>${size(capacity.used)} used`
        : (Object.hasOwn(states, volume.state) ? states[volume.state] : states.unavailable);
      return `<div data-volume-state="${escape(volume.state)}">${row(escape(name), path, status)}</div>`;
    }

    function dataVolumes() {
      const refresh = `<button type="button" data-action="storage-refresh" aria-disabled="${reading}">${AnimaPresentation.icon('renew')}<span>Refresh data volumes</span></button>`;
      const body = volumes === undefined ? '<p role="status">Reading data volumes…</p>'
        : volumes === null ? '<p class="notice warning" role="status">Data volume status is unavailable.</p>'
        : volumes.length ? volumes.map(volumeRow).join('') : '<p class="empty-state">No data volumes configured.</p>';
      return `<section class="section" data-data-volumes><h2>Data volumes</h2>${body}${refresh}</section>`;
    }

    function persistent(storage) {
      if (!storage) return '<p>System storage is unavailable.</p>';
      const values = [
        ['Used', storage.used],
        ['Available', storage.available ?? storage.total - storage.used],
        ['Total', storage.total],
      ];
      return '<div class="numbers">' + values.map(([label, bytes]) =>
        `<div><div class="overline">${label}</div><div class="number">${size(bytes)}</div></div>`).join('') + '</div>';
    }

    function render(state) {
      const drives = (state?.drives || []).filter(drive => drive.type === 'disk')
        .map(drive => row(escape(drive.model || drive.name), escape('/dev/' + drive.name), size(drive.size))).join('');
      return head('Storage', 'Disks and persistent capacity on this computer.') +
        '<section class="section"><h2>System storage</h2>' + persistent(state?.storage) + '</section>' +
        dataVolumes() + (drives ? '<section class="section"><h2>Physical disks</h2>' + drives + '</section>' : '') +
        '<div class="notice">OS rollback keeps the current workload data.</div>';
    }

    return {clear, refresh, render};
  },
};

 modal('Connect to Wi-Fi',`<p class="wifi-dialog-name">${title}</p><form id="wifi-form">${security==='Open network'?'<p>This is an open network. No password is required.</p>':'<label>Network password<input name="password" type="password" autocomplete="off"></label>'}<button class="primary">${icon('checkmark')}Connect</button></form>`,button('Cancel','close'));
}
function draw(){
 if(locked)return;
 root.querySelector('#node-label').textContent=state?.hostname?state.hostname+' · Anima OS':'Anima OS';
 nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===(settingsPages.includes(page)?'Settings':page)?'page':'false'));
 const screens={
 Overview:()=>head(esc(state?.hostname||'This computer'),'Local management · Anima OS')+connectionPanel()+'<div data-attention-overview aria-live="polite">'+AnimaActivity.overview(pageLink)+'</div>'+'<div data-overview-admission>'+workAdmission.render()+'</div>'+(state?.daemon==='failed'?`<div class="notice warning">Monitoring needs attention. ${pageLink('Recovery','Open diagnostics','Check the local service')}</div>`:'')+(updates.ready?`<div class="notice">An OS update is ready. ${pageLink('Updates','Review update','Restart only when you are ready')}</div>`:'')+`<section class="section"><h2>Local resources</h2><div id="telemetry-readings"></div></section><div class="summary-grid"><section><h2>Network</h2><p>${esc(networkLabel())}</p>${pageLink('Network','Network settings','Adapters and Wi-Fi')}</section><section><h2>Persistent storage</h2><p>${state?size(state.storage.available??state.storage.total-state.storage.used)+' available of '+size(state.storage.total):'Not yet checked'}</p>${pageLink('Storage','Storage details','Disks and capacity')}</section></div>`,
 Workloads:()=>AnimaWorkloads.render(esc),
 Activity:()=>AnimaActivity.render(esc,button,pageLink),
 Network:networkScreen,
 Storage:()=>storage.render(state),
 Settings:()=>head('Settings','Display preferences, system updates and local recovery.')+row('Private remote access','SSH, RDP and VNC through your enrolled device',button('Manage','remote-access-status'))+`<div class="settings-list">${pageLink('Display','Display & accessibility','Orientation and reduced motion')}${pageLink('Updates','OS updates','Check, stage or roll back a verified update')}${pageLink('Recovery','Diagnostics & recovery','Check services and find recovery options')}</div>`,
 Display:()=>display.render(motionChoice),
 Updates:updates.render,
 Recovery:()=>subhead('Diagnostics & recovery','Check this computer even when the hub is unavailable.')+row('System diagnostics','Radio, network and monitoring checks',button('Run checks','diagnostics'))+row('Maintenance','Review running work and power readiness',button('Review','maintenance-review'))+pageLink('Updates','OS rollback','Review the previous system and restart deliberately')+'<details><summary>Advanced recovery</summary><p>Press Ctrl+Alt+F2 and log in as admin. Return with Ctrl+Alt+F7. OS rollback is also available from the boot menu.</p><p>These options do not restore backups or erase your data.</p></details>'};
 pages.show(page,'<section id="operation-status" class="operation-status" role="status" hidden></section>'+(refreshFailed?'<p class="notice warning" role="status">The last refresh failed. Shown readings may be out of date.</p>':'')+screens[page]());
 renderTelemetry(icon,motion);updates.renderProgress();
}
function call(op,args={}){
 if(!bridge)return Promise.reject(Error('The local service is starting.'));
 const id=op==='unlock'?'unlock':crypto.randomUUID();
 if(waiting.has(id))return Promise.reject(Error('Wait for the current request.'));
 const quiet=op==='code-attention'||op==='workloads'||op==='work-admission'||op==='data-volumes'||op==='workload-logs'||op==='workload-build-logs'||op==='remote-access-status'||op==='update-status';if(!quiet)pending++;
 return new Promise((resolve,reject)=>{waiting.set(id,{resolve,reject,quiet});bridge.request(JSON.stringify({id,op,args}));});
}
function errorMessage(error){
 let message=overlay.querySelector('.message');
 if(overlay.hidden){modal('Unable to finish','<p class="message"></p>',button('Close','close'));message=overlay.querySelector('.message');}
 if(!message){message=document.createElement('p');message.className='message';overlay.querySelector('.dialog').append(message);}
 message.textContent=error.message;
 if(!locked&&!overlay.querySelector('[data-action=close]'))overlay.querySelector('.actions').innerHTML=button('Close','close');
}
function lock(heroMotion=true){
 AnimaWorkloads.clear();
 workAdmission.clear();
 storage.clear();
 AnimaActivity.clear();
 display.clear();
 pages.clear();
 locked=true;signedIn=false;email='';state=null;available=[];selected=null;
 scanState='not-scanned';scanVersion++;enrollment.clear();updates.clear();refreshFailed=false;
 root.querySelector('#node-label').textContent='Anima OS';
 clearInterval(poll);poll=null;
 modal('Local session locked','<p class="lock-summary">Your node keeps working.</p><p class="remote-connections" data-remote-connections role="status">'+remoteConnectionText()+'</p><p class="lock-description">Unlock to manage this computer. Turning off the display leaves applications and remote access running.</p><form id="unlock-form"><label>Local admin password<input type="password" name="password" autocomplete="current-password" aria-label="Local admin password" required></label><button class="primary" type="submit">'+icon('password')+'Unlock</button></form>',button('Turn screen off','screen-off'),heroMotion);
}
const networkSignature=value=>JSON.stringify([value?.radio,value?.supplicant,(value?.devices||[]).filter(d=>d.type==='wifi').map(d=>d.device).sort()]);
const attentionPage=()=>page==='Overview'||page==='Activity';
const refreshAttention=()=>AnimaActivity.refreshAttention(call,()=>{
 if(!locked&&attentionPage())AnimaActivity.updateAttention(main,esc,pageLink);
});
async function refresh(redraw=true){
 if(!locked&&attentionPage())void refreshAttention();
 if(!locked&&page==='Overview')void workAdmission.refresh();
 try{
  const next=await call('status');if(locked)return;
  if(networkSignature(state)!==networkSignature(next)){scanVersion++;scanState='not-scanned';available=[];}
  state=next;refreshFailed=false;
 }catch(error){refreshFailed=true;throw error;}
 finally{if(redraw&&!locked){draw();if(page==='Network'&&scanState==='not-scanned')void scanNetworks();}}
}
async function go(n,focus='h1'){
 if(!names.includes(n)&&!settingsPages.includes(n))return;page=n;close(true);main.scrollTop=0;draw();
 if(n==='Overview')void refreshAttention();
 if(n==='Updates')await updates.refresh();
 if(n==='Network'){await refresh(false);if(!locked&&page===n){draw();if(scanState==='not-scanned')void scanNetworks();}}
 await refreshPage(n);
 if(!locked&&page===n)main.querySelector(focus)?.focus({preventScroll:true});
}
async function refreshPage(n){
 if(n==='Overview')await workAdmission.refresh();
 if(n==='Workloads')await AnimaWorkloads.refresh(call,()=>{if(!locked&&page===n)draw();});
 if(n==='Activity')await refreshActivity();
 if(n==='Display')await display.refresh();
 if(n==='Storage')await storage.refresh();
}
async function refreshActivity(){
 void refreshAttention();await AnimaActivity.refresh(call);if(!locked&&page==='Activity')draw();
}
async function busy(op,args,label){
 modal(label,'<p>Please wait. This is a real operation on this computer.</p>','');
 try{const result=await call(op,args);close(true);return result;}catch(error){errorMessage(error);throw error;}
}
root.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b||b.closest('[inert]'))return;
 const a=b.dataset.action;
 if(a==='lock'){bridge.lock();return;}
 if(a==='screen-off'&&bridge){screenOffPending=true;AnimaHero.stop();bridge.screenOff();return;}
 if(locked)return;
 if(a==='terminal'){bridge.terminal();return;}
 if(a==='storage-refresh'){if(page==='Storage')await storage.refresh();return;}
 if(a==='workloads-refresh'){if(page==='Workloads'&&b.getAttribute('aria-disabled')!=='true')await refreshPage('Workloads');return;}
 if(pending&&!updates.working()&&!b.dataset.page)return;
 try{
 const maintenanceAction=maintenance.handle(a,b.dataset);
 if(maintenanceAction){await maintenanceAction;return;}
 if(a==='migration-accounts'){
  const version=dialog.version,result=await call('migration-accounts');
  if(!locked&&version===dialog.version)modal('Legacy Podman inventory','<p>'+esc(result.note)+'</p>'+result.accounts.map(account=>'<div class="row"><div><strong>'+esc(account.user)+'</strong><small>UID '+account.uid+' · '+(account.defaultStorageDetected?'Storage detected':'No standard storage')+'</small></div><button data-action="migration-inventory" data-uid="'+account.uid+'" '+(account.defaultStorageDetected?'':'disabled')+'>Inspect</button></div>').join(''),button('Close','close'));return;
 }
 if(a==='migration-inventory'){
  const version=dialog.version,result=await call('migration-inventory',{uid:Number(b.dataset.uid)});
  if(!locked&&version===dialog.version)modal('Migration inventory',AnimaWorkloads.legacy(result,esc),button('Close','close'));return;
 }
 if(a==='activity-refresh'){await refreshActivity();return;}
 const workloadAction=workloadDialogs(a,b.dataset);
 if(workloadAction){await workloadAction;return;}
  if(b.dataset.page){await go(b.dataset.page);return;}
  if(a==='close'){close();return;}
  if(a==='remote-disconnect-confirm'){
   const protocol=b.dataset.protocol;if(!['RDP','VNC'].includes(protocol))return;
   modal('Disconnect '+protocol+' clients?','<p>This restarts only the graphical transport. You may be disconnected. The shared console and applications keep running, and its lock state stays unchanged. Allowed clients can reconnect.</p>',button('Cancel','close')+'<button class="danger" data-action="remote-disconnect" data-protocol="'+protocol+'">Disconnect clients</button>');return;
  }
  if(a==='remote-disconnect'){
   await busy('remote-disconnect',{protocol:b.dataset.protocol,confirmed:true},'Disconnecting clients');
   if(!locked)await checkRemoteAccess();return;
  }
  if(a==='remote-access-status'){await checkRemoteAccess();return;}
  if(a==='remote-access-retry-defaults'){await checkRemoteAccess({retryDefaults:true});return;}
  if(a==='remote-access-select'){modal('Change private access','<p>'+esc(b.dataset.enabled==='true'?'Allow new '+b.dataset.protocol+' connections through your private link? Your hub permissions still apply.':'Disable '+b.dataset.protocol+' and disconnect its sessions through the private link?')+'</p><button data-action="remote-access-apply" data-port="'+esc(b.dataset.port)+'" data-enabled="'+esc(b.dataset.enabled)+'">Confirm</button>',button('Cancel','close'));return;}
  if(a==='remote-access-apply'){
   const version=dialog.version,access=await call('remote-access-set',{port:Number(b.dataset.port),enabled:b.dataset.enabled==='true',confirmed:true});
   if(!locked&&version===dialog.version)await checkRemoteAccess({access});return;
  }
  if(a==='settings-back'){const previous=page;await go('Settings',`[data-page="${previous}"]`);return;}
  if(a==='connection-details'){await checkRemoteAccess({monitoring:unitLabel(state?.daemon)});return;}
  if(a==='scan'){await scanNetworks();return;}
  if(a==='radio-on'){await busy('radio-on',{},'Enabling Wi-Fi');state=await call('status');scanState='not-scanned';await go('Network');return;}
  if(a?.startsWith('wifi-')){wifiDialog(available[Number(a.slice(5))]);return;}
  if(a==='update-check'){await updates.check(()=>busy('update-check',{},'Checking for updates'));}
  if(a==='update-download'){await updates.download();}
  if(a==='update-window-open'){updates.scheduleDialog();return;}
  if(a==='update-window-cancel'){updates.cancelDialog();return;}
  if(a==='update-window-cancel-confirm'){await updates.cancelWindow();return;}
  if(a==='selfhost'||a==='selfhost-direct'){enrollment.show(a==='selfhost-direct');return;}
  if(a==='switch-account'){await call('cancel-sign-in');signedIn=false;email='';draw();}
  if(a==='sign-in'||a==='switch-account'){
   await busy('sign-in',{},'Opening secure sign-in');
   modal('Continue in your browser','<p>Sign in here, or choose QR / code in the secure sign-in window to use your phone or another computer. Anima will return here automatically.</p>',button('Cancel sign-in','cancel-sign-in'));
   poll=setInterval(async()=>{if(pending||locked)return;try{const result=await call('sign-in-poll');if(result.signedIn){clearInterval(poll);poll=null;signedIn=true;email=result.email;close(true);draw();}}catch(error){clearInterval(poll);poll=null;errorMessage(error);}},1000);
  }
  if(a==='cancel-sign-in'){clearInterval(poll);poll=null;await call('cancel-sign-in');close();draw();}
  if(a==='add-computer'){await busy('enroll',{},'Adding this computer');signedIn=false;await refresh();}
  if(a==='diagnostics'){const result=await busy('diagnostics',{},'Checking the system');modal('System diagnostics',Object.entries(result).map(([k,v])=>row(esc(k),'',esc(v))).join(''),button('Done','close',true));}
  if(a==='keep-rotation'||a==='revert'){await call(a);if(!locked){close();await display.refresh();}}
 }catch(error){if(a==='add-computer'){signedIn=false;email='';draw();}if(!locked)errorMessage(error);}
});
root.addEventListener('submit',async e=>{
 e.preventDefault();const form=e.target,epoch=lockEpoch;if(form.closest('[inert]')||(pending&&!updates.working()))return;
 try{
  if(form.id==='unlock-form'){
   const password=form.elements.password.value;form.elements.password.value='';
   await call('unlock',{password});if(epoch!==lockEpoch)return;
   locked=false;close();void updates.refresh();
   await refresh();
   await refreshPage(page);
   return;
  }
  if(locked)return;
  if(form.id==='activation-window-form'){await updates.saveWindow(form);return;}
  if(form.id==='install-code-form'||form.id==='selfhost-form'){await enrollment.submit(form);return;}
  if(form.id==='wifi-form'){
   const password=form.elements.password?.value||'';if(form.elements.password)form.elements.password.value='';
   await busy('connect',{device:selected.device,bssid:selected.bssid,password},'Connecting to Wi-Fi');await refresh();
  }
  if(form.id==='display-form')await display.preview(form,dialog);
 }catch(error){if(epoch===lockEpoch||form.id==='unlock-form'&&form.isConnected&&locked)errorMessage(error);}
});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='l'&&bridge){e.preventDefault();bridge.lock();}});
root.addEventListener('change',e=>{
 if(e.target.dataset.workloadFilter&&!locked&&page==='Workloads'&&AnimaWorkloads.selectFilter(e.target.dataset.workloadFilter,e.target.value))draw();
 if(e.target.matches('#display-form [name=output]'))display.select(e.target.value);
 if(e.target.id==='motion-choice'){motionChoice=e.target.value;localStorage.setItem('motion',motionChoice);syncMotion();}
});
root.addEventListener('toggle',e=>{if(e.target.tagName==='DETAILS'&&e.target.open)for(const child of e.target.children)if(child.tagName!=='SUMMARY')animate(child,[{opacity:0},{opacity:1}]);},true);
lock();
new QWebChannel(qt.webChannelTransport,channel=>{
 bridge=channel.objects.console;
 bridge.telemetryChanged.connect(text=>{const sample=JSON.parse(text);updateTelemetry(sample,icon,motion);showConnectionStatus(sample?.remoteConnections);});
 bridge.telemetry();
 bridge.answer.connect(text=>{const answer=JSON.parse(text),task=waiting.get(answer.id);if(!task)return;waiting.delete(answer.id);if(!task.quiet)pending=Math.max(0,pending-1);answer.ok?task.resolve(answer.value):task.reject(Error(answer.error));});
 bridge.locked.connect(()=>{
  const heroMotion=!screenOffPending;screenOffPending=false;lockEpoch++;
  for(const task of waiting.values())task.reject(Error('The local session is locked.'));
  waiting.clear();pending=0;if(!locked)lock(heroMotion);
 });
 setInterval(()=>{
  if(locked||(pending&&pending!==networkScans)||!overlay.hidden)return;
  if(page==='Updates')void updates.refresh();
  refresh(['Overview','Network','Storage'].includes(page)).catch(()=>{if(!locked)root.querySelector('#node-label').textContent='Status unavailable · retrying';});
 },10000);
});

})();
</script></body></html>
