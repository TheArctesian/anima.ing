<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anima OS · synthetic graphical preview</title><style>
:root{color-scheme:dark;--card:#1B1D21;--foreground:#E6E7E9;--muted-foreground:#A4A8B0;--secondary:#23262B;--border:#353941;--primary:#88C0D0;--primary-foreground:#151C20;--success:#8FBCBB;--warning:#D8B47B;--danger:#D99BA1;--radius:4px}
html,body{margin:0;background:var(--card);overflow:hidden}
#anima-console{font-family:'IBM Plex Sans',sans-serif;color:var(--foreground);font-size:14px;line-height:1.5;--motion-press:100ms;--motion-fast:150ms;--motion-base:200ms;--motion-enter:cubic-bezier(.2,0,0,1)}
#anima-console *{box-sizing:border-box}
#anima-console .shell{height:100dvh;min-height:0;padding:24px 32px;display:grid;grid-template-columns:172px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:0 32px;overflow:hidden;position:relative}
#anima-console header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--border);gap:16px}
#anima-console .wordmark{width:148px;height:24px;object-fit:contain;object-position:left}
#anima-console .identity,#anima-console .header-status,#battery-status{display:flex;align-items:center;gap:12px}
#anima-console .identity{color:var(--muted-foreground);font-size:12px}
#anima-console nav{padding:24px 16px 0 0;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
#anima-console nav small{padding:0 10px 10px;color:var(--muted-foreground);font-size:12px}
#anima-console button,#anima-console input,#anima-console select{font:inherit}
#anima-console button{display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--foreground);background:var(--secondary);border:1px solid var(--border);border-radius:var(--radius);padding:9px 13px;min-height:40px;cursor:pointer;transition:background-color var(--motion-fast),border-color var(--motion-fast),color var(--motion-fast),transform var(--motion-press) var(--motion-enter)}
#anima-console button:hover{border-color:var(--primary)}
#anima-console button:focus-visible,#anima-console input:focus-visible,#anima-console select:focus-visible,#anima-console summary:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
#anima-console button.primary{background:var(--primary);color:var(--primary-foreground);border-color:transparent;font-weight:500}
#anima-console button.quiet{border-color:transparent;background:transparent}
#anima-console button:active:not(:disabled){transform:scale(.975)}
#anima-console button:disabled{cursor:not-allowed;opacity:.65}
#anima-console nav button{justify-content:flex-start;text-align:left;background:transparent;border-color:transparent;color:var(--muted-foreground);padding:9px 10px}
#anima-console nav button[aria-current=page]{background:var(--secondary);color:var(--foreground)}
#anima-console main{position:relative;min-width:0;min-height:0;overflow:auto;overflow-x:hidden;padding:28px 4px 28px 0;scrollbar-width:thin;scrollbar-color:#454A53 transparent}
#anima-console main::-webkit-scrollbar{width:6px}
#anima-console main::-webkit-scrollbar-thumb{background:#454A53;border-radius:var(--radius)}
#anima-console .page-content{width:100%;max-width:1080px}
#anima-console .page-outgoing{position:absolute;inset:28px 4px 28px 0;pointer-events:none;max-width:1080px}
#anima-console h1{font-size:34px;line-height:1.2;letter-spacing:-.8px;font-weight:300;margin:0 0 8px;overflow-wrap:anywhere;outline:0}
#anima-console h2{font-size:16px;font-weight:500;margin:0 0 8px}
#anima-console p{margin:0 0 20px;color:var(--muted-foreground);max-width:680px}
#anima-console .topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
#anima-console .topline h2{margin:0}
#anima-console .connection{padding:20px;background:var(--secondary);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between;gap:20px;margin:24px 0 12px}
#anima-console .connection p{margin:0;max-width:480px}
#anima-console .connection .actions{flex-shrink:0;flex-direction:column;align-items:stretch}
#anima-console .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#anima-console .row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid var(--border);max-width:880px}
#anima-console .row:last-child{border-bottom:0}
#anima-console .row small{display:block;color:var(--muted-foreground);font-size:12px;margin-top:3px}
#anima-console .row .value{color:var(--muted-foreground);text-align:right;font-size:13px;overflow-wrap:anywhere;min-width:0;white-space:pre-wrap}
#anima-console .row-title{display:flex;align-items:center;gap:12px;min-width:0;overflow-wrap:anywhere}
#anima-console .row-title>.glyph{color:var(--muted-foreground)}
#anima-console .section{margin-top:24px}
#anima-console .summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:22px;border-top:1px solid var(--border);padding-top:22px}
#anima-console .summary-grid p{margin-bottom:10px;overflow-wrap:anywhere}
#anima-console .settings-list{max-width:800px;margin-top:24px}
#anima-console .setting-link{width:100%;justify-content:flex-start;text-align:left;background:transparent;border-width:0 0 1px;border-radius:0;padding:18px 0;gap:14px}
#anima-console .setting-link>span:not(.glyph){flex:1;min-width:0}
#anima-console .setting-link strong{font-weight:500;display:block}
#anima-console .setting-link small{display:block;color:var(--muted-foreground);font-size:12px;margin-top:3px}
#anima-console .setting-link:hover{background:var(--secondary)}
#anima-console .summary-grid .setting-link{padding:8px 0;border:0}
#anima-console [data-action=settings-back]{margin-bottom:20px;background:transparent;border-color:transparent;color:var(--muted-foreground);padding-left:0}
#anima-console .overline{font-size:12px;color:var(--muted-foreground);margin-bottom:4px}
#anima-console .notice{padding:12px 16px;border-left:2px solid var(--border);margin:20px 0;color:var(--muted-foreground);font-size:13px;max-width:800px}
#anima-console .notice.warning{border-color:var(--warning);color:var(--warning)}
#anima-console .empty-state{padding:20px 0;margin:0}
#anima-console label{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;font-size:13px;max-width:620px}
#anima-console input,#anima-console select{color:var(--foreground);background:#16181B;border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;width:100%;min-width:0;min-height:44px}
#anima-console form{max-width:620px;margin-top:24px}
#anima-console .hint{font-size:12px;color:var(--muted-foreground)}
#anima-console .numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:24px 0 16px}
#anima-console .number{font-size:26px;font-weight:300;letter-spacing:-.5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#anima-console footer{grid-column:2;display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--border);padding-top:12px;font-size:12px;color:var(--muted-foreground);position:relative;z-index:1;background:var(--card)}
#anima-console .overlay{position:fixed;inset:0;z-index:5;background:#101216bb;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
#anima-console .dialog{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;width:520px;max-width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 70px #0005}
#anima-console .dialog h2{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:300;margin-bottom:12px}
#anima-console .dialog h2 .glyph{width:22px;height:22px;flex-basis:22px;color:var(--primary)}
#anima-console .dialog .actions{justify-content:flex-end;margin-top:24px}
#anima-console .dialog p{font-size:14px}
#anima-console .message{color:var(--danger);margin:12px 0}
#anima-console details{margin-top:24px;color:var(--muted-foreground);font-size:13px;max-width:800px}
#anima-console summary{cursor:pointer;padding:12px 0;min-height:44px}
#anima-console details p{margin:16px 0}
#anima-console [hidden]{display:none!important}
#anima-console .glyph{display:inline-block;width:18px;height:18px;flex:0 0 18px;background:currentColor;mask-image:var(--glyph);mask-size:contain;mask-position:center;mask-repeat:no-repeat;vertical-align:middle}
#anima-console .utility{width:40px;height:40px;padding:9px}
#anima-console .utility[data-action=shutdown]:hover{color:var(--danger);border-color:var(--danger)}
#anima-console .shell[data-locked] main,#anima-console .shell[data-locked] nav,#anima-console .shell[data-locked] header .identity,#anima-console .shell[data-locked] footer{visibility:hidden}
#anima-console #revert-count{font-variant-numeric:tabular-nums}
#anima-console[data-reduced=true] button{transition:none;transform:none}
#anima-console .battery{display:inline-flex;color:var(--foreground)}
#anima-console .battery svg{width:32px;height:24px}
#anima-console .battery[data-low=true]{color:var(--danger)}
#anima-console .shell[data-locked] #battery-status{position:relative;z-index:6}
#telemetry-readings{display:flex;flex-wrap:wrap;gap:16px 28px;margin:16px 0}
#telemetry-readings .metric{flex:1;min-width:120px;display:grid;grid-template-columns:1fr auto;gap:8px}
#telemetry-readings meter{grid-column:1/-1;width:100%;height:8px;accent-color:var(--primary)}
#telemetry-readings p{width:100%;margin:0}
#telemetry-readings meter::-webkit-meter-bar{background:#2C3036;border:0;border-radius:var(--radius)}
#telemetry-readings meter::-webkit-meter-optimum-value{background:var(--primary)}
@media(min-width:1600px){#anima-console .shell{padding:32px 48px;column-gap:48px}#anima-console h1{font-size:38px}}
@media(max-width:900px){#anima-console .shell{padding:20px 24px;grid-template-columns:144px minmax(0,1fr);column-gap:24px}#anima-console .connection{align-items:flex-start;flex-direction:column}#anima-console .connection .actions{flex-direction:row;flex-wrap:wrap}#anima-console .summary-grid{gap:20px}#anima-console .identity>span{display:none}}
@media(max-width:650px){#anima-console .shell{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr) auto;padding:16px}#anima-console header{padding-bottom:12px}#anima-console nav{flex-direction:row;gap:4px;padding:10px 0;border:0;border-bottom:1px solid var(--border)}#anima-console nav small{display:none}#anima-console nav button{flex:1;justify-content:center;font-size:13px;padding:8px 6px}#anima-console nav .glyph{display:none}#anima-console main{padding-top:20px}#anima-console footer{grid-column:1}#anima-console h1{font-size:28px}#anima-console .connection{padding:16px;margin-top:20px}#anima-console .row{gap:12px;flex-wrap:wrap}#anima-console .numbers{gap:12px}#anima-console .number{font-size:22px}#anima-console .dialog{padding:20px}#anima-console .overlay{padding:16px}#anima-console input,#anima-console select{font-size:16px}#anima-console .page-outgoing{top:20px}#anima-console .summary-grid{grid-template-columns:1fr;gap:20px}}
@media(max-height:550px){#anima-console .shell{padding-top:12px;padding-bottom:12px}#anima-console header{padding-bottom:10px}#anima-console main{padding-top:18px}#anima-console .dialog{padding:20px}#anima-console .dialog form{margin-top:16px}#anima-console .dialog .actions{margin-top:16px}}
@media(pointer:coarse){#anima-console button,#anima-console .utility{min-height:44px}#anima-console .utility{width:44px}}
@media(prefers-reduced-motion:reduce){#anima-console button{transition:none;transform:none}}

#anima-console .operation-status{border-left:2px solid var(--primary);background:var(--secondary);padding:12px 16px;margin-bottom:20px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
#anima-console .operation-status span{color:var(--muted-foreground);font-size:13px}
#anima-console .operation-status progress{width:100%;height:6px;accent-color:var(--primary)}
#anima-console .operation-status .setting-link{padding:0;border:0}

 for(const battery of localReadings.batteries){
  const badge=document.createElement('span');
  const percentage=battery.percent;

  badge.className='battery';badge.title=label;badge.setAttribute('aria-label',label);badge.setAttribute('role','img');

const actionIcons={'update-check':'renew','update-download':'download','update-restart':'renew','update-rollback-prompt':'arrow-left','selfhost':'network-3','sign-in':'user-avatar','signin-complete':'arrow-right','add-computer':'add','switch-account':'user-avatar','overview':'arrow-left','anima':'connection-signal','network':'network-3','close':'close','wifi-toggle':'connection-signal','wifi-password':'connection-signal','guest-password':'connection-signal','wifi-confirm':'checkmark','wifi-details':'settings','network-save':'checkmark','check-hub':'renew','drive-details':'data-base','diagnostics':'activity','report':'document','export':'download','power':'power','restart':'renew','shutdown':'power','power-confirm':'checkmark','lock':'locked','terminal':'terminal','keep-rotation':'checkmark'};
const button=(label,action,primary=false)=>`<button type="button" data-action="${action}" class="${primary?'primary':''}">${icon(/Unlock/.test(label)?'password':label==='Done'?'checkmark':actionIcons[action]||'arrow-right')}<span>${label}</span></button>`;
const rowIcon=name=>name==='Sign in'?'user-avatar':name==='Ready'?'checkmark':/Wi-Fi|network|Wireless/.test(name)?'connection-signal':/Storage|drive|Filesystem|Capacity|Storage/.test(name)?'data-base':/Account|Signed in/.test(name)?'user-avatar':/Workspace|workspace|Anima/.test(name)?'network-3':/Computer|computer|Device/.test(name)?'bare-metal-server':/Security|Encryption/.test(name)?'security':/Internet|Address/.test(name)?'earth':/report/.test(name)?'document':'activity';
const row=(name,detail,right)=>`<div class="row"><div class="row-title">${icon(rowIcon(name))}<div>${name}<small>${detail}</small></div></div><div class="value">${right}</div></div>`;

const head=(title,body)=>`<h1 tabindex="-1">${title}</h1><p>${body}</p>`;
const subhead=(title,body)=>button('Settings','settings-back')+head(title,body);
const pageLink=(name,title,detail)=>`<button type="button" class="setting-link" data-page="${name}">${icon(name)}<span><strong>${title}</strong><small>${detail}</small></span>${icon('arrow-right')}</button>`;
let state=null,available=[],displays=[],signedIn=false,email='',locked=true,pending=0,bridge=null,poll=null,powerAction='',selected=null,updateState=null,updateOffer=null,scanState='not-scanned',refreshFailed=false,updateWorking=false,updatePoll=null,updatePolling=false,downloadPending=false,selfhostHub='';
const waiting=new Map();

const size=value=>(value/1024**3).toFixed(1)+' GB';
const unitLabel=value=>({active:'Running',inactive:'Stopped',failed:'Needs attention',activating:'Starting',deactivating:'Stopping',unknown:'Unavailable'}[value]||'Not yet checked');
const networkLabel=()=>state?.devices?.find(d=>d.state==='connected')?.connection||'No active connection';
const phaseLabel=value=>({idle:'Not checked',current:'Up to date',staged:'Ready to restart',booting:'Awaiting boot checks','rolled-back':'Previous system restored',checking:'Checking release',downloading:'Downloading',verifying:'Verifying download',importing:'Importing system',staging:'Preparing next boot',interrupted:'Needs review'}[value]||'Not yet checked');
function connectionPanel(){
 if(state?.enrolled)return `<section class="connection"><div><h2>Enrollment saved</h2><p>Monitoring is ${esc(unitLabel(state.daemon).toLowerCase())}. Hub reachability has not been verified.</p></div>${button('Connection details','connection-details')}</section>`;
 if(signedIn)return `<section class="connection"><div><h2>Add this computer</h2><p>Signed in as ${esc(email)}. Add ${esc(state?.hostname||'this computer')} to your account’s hub.</p></div><div class="actions">${button('Add this computer','add-computer',true)}${button('Use another account','switch-account')}</div></section><p class="hint">This enrolls monitoring and the private link. It does not grant new workload or shell permissions.</p>`;
 return `<section class="connection"><div><h2>Connect to Anima</h2><p>Sign in, then confirm that you want to add this computer.</p></div><div class="actions">${button('Sign in to Anima','sign-in',true)}${button('Use your own hub','selfhost')}</div></section>`;
}
function networkScreen(){
 const adapters=(state?.devices||[]).filter(d=>['wifi','ethernet'].includes(d.type));
 const wifi=adapters.some(d=>d.type==='wifi');
 let notice=state?'No Wi-Fi adapter was detected. Ethernet connections appear above.':'Network information is not yet available.';
 if(wifi)notice=scanState==='empty'?'No networks found. Move closer to an access point and scan again.':scanState==='failed'?'The scan could not finish. Check the Wi-Fi service and try again.':'Scan to see nearby Wi-Fi networks.';
 if(state?.radio==='disabled')notice='Wi-Fi is switched off.';
 if(state?.supplicant==='failed')notice='The Wi-Fi service needs attention. Open Settings → Diagnostics & recovery for checks.';
 return head('Network','Connections on this computer. Local controls remain available offline.')+adapters.map(d=>row(esc(d.device),esc(d.connection||'No saved connection'),esc(d.state))).join('')+`<section class="section"><div class="topline"><h2>Nearby Wi-Fi</h2>${wifi&&state?.radio!=='disabled'?button('Scan networks','scan'):''}</div>${state?.radio==='disabled'?button('Turn Wi-Fi on','radio-on'):''}${available.length&&state?.radio!=='disabled'?available.map((n,i)=>row(esc(n.ssid||'Hidden network'),esc(n.device+' · '+n.signal+'% signal · '+n.security),button('Connect','wifi-'+i))).join(''):`<p class="empty-state">${notice}</p>`}</section>`;
}
function renderOperation(){
 const panel=main.querySelector('#operation-status');if(!panel)return;
 const operation=updateState?.operation;
 panel.hidden=!updateWorking&&!operation;
 if(panel.hidden)return;
 const measured=Number.isFinite(operation?.bytes)&&Number.isFinite(operation?.totalBytes)&&operation.totalBytes>0;
 panel.innerHTML=`<strong>OS update · ${phaseLabel(operation?.phase||'downloading')}</strong>${measured?`<span>${size(operation.bytes)} of ${size(operation.totalBytes)}</span><progress max="${operation.totalBytes}" value="${operation.bytes}" aria-label="Update transfer"></progress>`:`<span>${operation?.phase==='interrupted'?'The update did not finish. Review its status before trying again.':'Working. You can keep using local controls.'}</span>`}${page!=='Updates'?pageLink('Updates','View update','Progress and restart options'):''}`;
}
async function pollUpdate(){
 if(updatePolling||locked)return;updatePolling=true;
 try{updateState=await call('update-status');if(!downloadPending&&(!updateState.operation||updateState.operation.phase==='interrupted')){clearInterval(updatePoll);updatePoll=null;updateWorking=false;draw();}else renderOperation();}catch(error){root.querySelector('#node-label').textContent='Update progress unavailable · retrying';}finally{updatePolling=false;}
}
async function downloadUpdate(){
 if(updateWorking)return;updateWorking=true;downloadPending=true;draw();
 updatePoll=setInterval(pollUpdate,1000);pollUpdate();
 try{updateState=await call('update-download');updateOffer=null;}
 finally{clearInterval(updatePoll);updatePoll=null;updateWorking=false;downloadPending=false;if(!locked)draw();}
}
function draw(){
 root.querySelector('#node-label').textContent=state?.hostname?state.hostname+' · Anima OS Preview':'Anima OS Preview';
 nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===(settingsPages.includes(page)?'Settings':page)?'page':'false'));
 const screens={
 Overview:()=>head(esc(state?.hostname||'This computer'),'Local management · Anima OS Preview')+connectionPanel()+(state?.daemon==='failed'?`<div class="notice warning">Monitoring needs attention. ${pageLink('Recovery','Open diagnostics','Check the local service')}</div>`:'')+(updateState?.phase==='staged'?`<div class="notice">An OS update is ready. ${pageLink('Updates','Review update','Restart only when you are ready')}</div>`:'')+`<section class="section"><h2>Local resources</h2><div id="telemetry-readings"></div></section><div class="summary-grid"><section><h2>Network</h2><p>${esc(networkLabel())}</p>${pageLink('Network','Network settings','Adapters and Wi-Fi')}</section><section><h2>Persistent storage</h2><p>${state?size(state.storage.total-state.storage.used)+' available of '+size(state.storage.total):'Not yet checked'}</p>${pageLink('Storage','Storage details','Disks and capacity')}</section></div>`,
 Network:networkScreen,
 Storage:()=>head('Storage','Disks and persistent capacity on this computer.')+(state?`<div class="numbers"><div><div class="overline">Used</div><div class="number">${size(state.storage.used)}</div></div><div><div class="overline">Available</div><div class="number">${size(state.storage.total-state.storage.used)}</div></div><div><div class="overline">Total</div><div class="number">${size(state.storage.total)}</div></div></div>`:'<p>Storage information is not yet available.</p>')+(state?.drives||[]).filter(d=>d.type==='disk').map(d=>row(esc(d.model||d.name),esc('/dev/'+d.name),size(d.size))).join('')+'<div class="notice">Persistent data is separate from the OS. An OS rollback does not restore older workload data.</div>',
 Settings:()=>head('Settings','Display preferences, system updates and local recovery.')+`<div class="settings-list">${pageLink('Display','Display & accessibility','Orientation and reduced motion')}${pageLink('Updates','OS updates','Check, stage or roll back a verified update')}${pageLink('Recovery','Diagnostics & recovery','Check services and find recovery options')}</div>`,
 Display:()=>subhead('Display & accessibility','Keep this screen readable without interrupting background services.')+`<form id="display-form"><label>Display<select name="output">${displays.map(d=>`<option value="${esc(d.name)}">${esc(d.name)}</option>`).join('')}</select></label><label>Orientation<select name="rotation"><option value="normal">Landscape</option><option value="left">Portrait left</option><option value="right">Portrait right</option><option value="inverted">Landscape flipped</option></select></label><button class="primary" ${displays.length?'':'disabled'}>${icon('checkmark')}Apply display settings</button></form>${displays.length?'':'<p>No configurable display is available. Return to Settings and try again.</p>'}<div class="notice">Unconfirmed changes revert after 15 seconds. Confirmed orientation is saved for future boots.</div><label>Interface motion<select id="motion-choice"><option value="system" ${motionChoice==='system'?'selected':''}>Follow system</option><option value="reduced" ${motionChoice==='reduced'?'selected':''}>Reduced motion</option></select></label><p class="hint">Locking the screen does not suspend the server.</p>`,
 Updates:()=>subhead('OS updates','Verified system updates retain your persistent data.')+row('Update status','This computer',phaseLabel(updateState?.phase))+(updateState?.version?row('Release',esc(updateState.version),phaseLabel(updateState.phase)):'')+`<div class="actions">${button('Check for updates','update-check')}${updateState?.phase==='staged'?button('Restart to update','update-restart',true):''}${updateState?.previous?button('Roll back OS','update-rollback-prompt'):''}</div>`+(updateOffer?.available?`<div class="section"><h2>Preview ${esc(updateOffer.release.version)}</h2><p>${size(updateOffer.release.bytes)} download. The current system is retained for recovery.</p>${button('Download update','update-download',true)}</div>`:updateOffer?'<p class="empty-state">No newer system is available.</p>':'')+'<div class="notice">Downloading keeps services running. Restarting interrupts work; finish it first. OS rollback does not rewind your data.</div>',
 Recovery:()=>subhead('Diagnostics & recovery','Check this computer even when the hub is unavailable.')+row('System diagnostics','Radio, network and monitoring checks',button('Run checks','diagnostics'))+pageLink('Updates','OS rollback','Review the previous system and restart deliberately')+'<details><summary>Advanced recovery</summary><p>Press Ctrl+Alt+F2 and log in as admin. Return with Ctrl+Alt+F7. OS rollback is also available from the boot menu.</p><p>These options do not restore backups or erase your data.</p></details>'};
 const scroll=main.scrollTop,active=document.activeElement,action=main.contains(active)?active?.dataset?.action:null;
 showPage('<section id="operation-status" class="operation-status" role="status" hidden></section>'+(refreshFailed?'<p class="notice warning" role="status">The last refresh failed. Shown readings may be out of date.</p>':'')+screens[page]());
 main.scrollTop=scroll;
 if(action)main.querySelector(`[data-action="${CSS.escape(action)}"]`)?.focus({preventScroll:true});
 renderTelemetry();renderOperation();
}
function close(immediate=false){
 clearInterval(timer);timer=null;
 if(overlay.hidden||closing)return;
 closing=true;const version=++dialogVersion;
 const finish=()=>{
  if(version!==dialogVersion)return;
  overlay.hidden=true;overlay.innerHTML='';closing=false;
  root.querySelector('.shell').removeAttribute('data-locked');
  backgroundInert(false);
  if(returnFocus?.isConnected)returnFocus.focus();else (root.querySelector(returnSelector||'.page-content h1')||main.querySelector('h1'))?.focus({preventScroll:true});
 };
 if(immediate||reduced()){finish();return;}
 animate(overlay,[{opacity:getComputedStyle(overlay).opacity},{opacity:0}],role.fast).then(finish);
}
function modal(title,body,actions){
 ++dialogVersion;closing=false;
 if(overlay.hidden){returnFocus=document.activeElement;const action=returnFocus?.dataset?.action,route=returnFocus?.dataset?.page;returnSelector=action?`[data-action="${CSS.escape(action)}"]`:route?`[data-page="${CSS.escape(route)}"]`:null;}
 overlay.getAnimations({subtree:true}).forEach(animation=>animation.cancel());
 clearInterval(timer);timer=null;
 overlay.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><h2>${icon(/locked|sign-in/i.test(title)?'locked':/Restart|Shut down|Power/.test(title)?'power':/Wi-Fi|network/i.test(title)?'connection-signal':'settings')}${title}</h2>${body}<div class="actions">${actions}</div></section>`;
 overlay.hidden=false;backgroundInert(true);
 const locked=title==='Local session locked';
 root.querySelector('.shell').toggleAttribute('data-locked',locked);
 if(!locked){
  animate(overlay,[{opacity:0},{opacity:1}],role.fast);
  animate(overlay.querySelector('.dialog'),[{transform:'translateY(6px)',opacity:0},{transform:'translateY(0)',opacity:1}]);
 }
 overlay.querySelector('input,button')?.focus();
}
function call(op,args={}){
 if(!bridge)return Promise.reject(Error('The local service is starting.'));
 const id=op==='unlock'?'unlock':crypto.randomUUID();
 if(waiting.has(id))return Promise.reject(Error('Wait for the current request.'));
 pending++;
 return new Promise((resolve,reject)=>{waiting.set(id,{resolve,reject});bridge.request(JSON.stringify({id,op,args}));});
}
function errorMessage(error){
 let message=overlay.querySelector('.message');
 if(overlay.hidden){modal('Unable to finish','<p class="message"></p>',button('Close','close'));message=overlay.querySelector('.message');}
 if(!message){message=document.createElement('p');message.className='message';overlay.querySelector('.dialog').append(message);}
 message.textContent=error.message;
 if(!locked&&!overlay.querySelector('[data-action=close]'))overlay.querySelector('.actions').innerHTML=button('Close','close');
}
function lock(){
 locked=true;signedIn=false;email='';state=null;available=[];scanState='not-scanned';selfhostHub='';
 clearInterval(poll);poll=null;clearInterval(updatePoll);updatePoll=null;updateWorking=false;
 close(true);
 modal('Local session locked','<p>Your node stays awake. Apps, monitoring and authorized remote access continue running.</p><form id="unlock-form"><label>Local admin password<input type="password" name="password" autocomplete="current-password" required></label><button class="primary" type="submit">'+icon('password')+'Unlock</button></form>','');
}
async function refresh(redraw=true){try{state=await call('status');refreshFailed=false;}catch(error){refreshFailed=true;throw error;}finally{if(redraw&&!locked)draw();}}
async function go(n,focus='h1'){if(!names.includes(n)&&!settingsPages.includes(n))return;page=n;close(true);main.scrollTop=0;draw();if(n==='Updates'){updateState=await call('update-status');draw();}if(n==='Display'){displays=await call('displays');draw();}main.querySelector(focus)?.focus({preventScroll:true});}
async function busy(op,args,label){
 modal(label,'<p>Please wait. This is a real operation on this computer.</p>','');
 try{const result=await call(op,args);close(true);return result;}catch(error){errorMessage(error);throw error;}
}
root.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 const a=b.dataset.action;
 if(a==='lock'){bridge.lock();return;}
 if(locked)return;
 if(pending&&!updateWorking)return;
 try{
  if(b.dataset.page){await go(b.dataset.page);return;}
  if(a==='close'){close();return;}
  if(a==='settings-back'){const previous=page;await go('Settings',`[data-page="${previous}"]`);return;}
  if(a==='connection-details'){modal('Connection details',row('Enrollment','Saved on this computer','Saved')+row('Monitoring','Local process state',unitLabel(state?.daemon))+'<p>Hub reachability and work readiness have not been verified. Locking the screen keeps background services running.</p>',button('Done','close',true));return;}
  if(a==='scan'){try{available=await busy('scan',{},'Scanning nearby Wi-Fi');scanState=available.length?'found':'empty';}catch(error){scanState='failed';available=[];throw error;}finally{draw();}}
  if(a==='radio-on'){await busy('radio-on',{},'Enabling Wi-Fi');state=await call('status');await go('Network');return;}
  if(a?.startsWith('wifi-')){selected=available[Number(a.slice(5))];if(!selected)return;modal('Connect to Wi-Fi',`<p>${esc(selected.ssid)} · ${esc(selected.device)}</p><form id="wifi-form"><label>Network password<input name="password" type="password" autocomplete="off"></label><p class="hint">Leave blank for an open network. Enterprise Wi-Fi requires advanced recovery configuration.</p><button class="primary">${icon('checkmark')}Connect</button></form>`,button('Cancel','close'));}
  if(a==='update-check'){updateOffer=await busy('update-check',{},'Checking for updates');updateState=updateOffer.state;draw();}
  if(a==='update-download'){await downloadUpdate();}
  if(a==='update-restart'||a==='update-rollback-prompt'){powerAction=a==='update-restart'?'update-activate':'update-rollback';modal('Restart this computer?', '<p>Finish or stop running jobs before continuing. Services and remote access stop during restart. Persistent data is retained.</p>',button('Cancel','close')+button('Restart now','power-confirm',true));}
  if(a==='selfhost'){modal('Connect to your hub',`<p>Your hub must be reachable over your private network with a valid HTTPS certificate. Create this device in the hub, then copy its enrollment code.</p><form id="selfhost-form"><label>Hub address<input type="url" name="hub" placeholder="https://hub.example" value="${esc(selfhostHub)}" required></label><label>Enrollment code<input type="password" name="code" autocomplete="off" required></label><button class="primary">${icon('connection-signal')}Connect this computer</button></form>`,button('Cancel','close'));}
  if(a==='switch-account'){await call('cancel-sign-in');signedIn=false;email='';draw();}
  if(a==='sign-in'||a==='switch-account'){
   await busy('sign-in',{},'Opening secure sign-in');
   modal('Continue in your browser','<p>Complete sign-in in the secure browser. Anima will return here automatically.</p>',button('Cancel sign-in','cancel-sign-in'));
   poll=setInterval(async()=>{if(pending||locked)return;try{const result=await call('sign-in-poll');if(result.signedIn){clearInterval(poll);poll=null;signedIn=true;email=result.email;close(true);draw();}}catch(error){clearInterval(poll);poll=null;errorMessage(error);}},1000);
  }
  if(a==='cancel-sign-in'){clearInterval(poll);poll=null;await call('cancel-sign-in');close();draw();}
  if(a==='add-computer'){await busy('enroll',{},'Adding this computer');signedIn=false;await refresh();}
  if(a==='diagnostics'){const result=await busy('diagnostics',{},'Checking the system');modal('System diagnostics',Object.entries(result).map(([k,v])=>row(esc(k),'',esc(v))).join(''),button('Done','close',true));}
  if(a==='restart'||a==='shutdown'){powerAction=a;modal(a==='restart'?'Restart this computer?':'Shut down this computer?','<p>This stops services and disconnects remote access. Running work may be interrupted.</p>',button('Cancel','close')+button(a==='restart'?'Restart':'Shut down','power-confirm',true));}
  if(a==='power-confirm'){await busy(powerAction,{confirmed:true},'Stopping this computer');}
  if(a==='keep-rotation'){await call('keep-rotation');close();}
  if(a==='revert'){await call('revert');close();}
 }catch(error){if(a==='add-computer'){signedIn=false;email='';draw();}errorMessage(error);}
});
root.addEventListener('submit',async e=>{
 e.preventDefault();const form=e.target;if(pending&&!updateWorking)return;
 try{
  if(form.id==='unlock-form'){
   const password=form.elements.password.value;form.elements.password.value='';
   await call('unlock',{password});locked=false;close(true);await refresh();
   try{updateState=await call('update-status');if(updateState.operation&&updateState.operation.phase!=='interrupted'){updateWorking=true;updatePoll=setInterval(pollUpdate,1000);}draw();}catch(error){root.querySelector('#node-label').textContent='Update status unavailable · open Settings to retry';}return;
  }
  if(locked)return;
  if(form.id==='selfhost-form'){
   const hub=form.elements.hub.value,code=form.elements.code.value;selfhostHub=hub;form.elements.code.value='';
   await busy('enroll-selfhost',{hub,code},'Connecting to your hub');await refresh();
  }
  if(form.id==='wifi-form'){
   const password=form.elements.password.value;form.elements.password.value='';
   await busy('connect',{device:selected.device,bssid:selected.bssid,password},'Connecting to Wi-Fi');await refresh();
  }
  if(form.id==='display-form'){
   await call('rotate',{output:form.elements.output.value,rotation:form.elements.rotation.value});
   const deadline=Date.now()+15000;
   modal('Keep these display settings?','<p id="revert-count">Reverting in 15 seconds.</p>',button('Revert','revert')+button('Keep settings','keep-rotation',true));
   timer=setInterval(()=>{const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!left){close();return;}overlay.querySelector('#revert-count').textContent=`Reverting in ${left} seconds.`;},200);
  }
 }catch(error){errorMessage(error);}
});
overlay.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!locked&&!pending&&!overlay.querySelector('#revert-count'))close();
 if(e.key==='Tab'){const controls=[...overlay.querySelectorAll('button,input,select')];const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='l'&&bridge){e.preventDefault();bridge.lock();}});
root.addEventListener('change',e=>{if(e.target.id==='motion-choice'){motionChoice=e.target.value;localStorage.setItem('motion',motionChoice);syncMotion();}});
root.addEventListener('toggle',e=>{if(e.target.tagName==='DETAILS'&&e.target.open)for(const child of e.target.children)if(child.tagName!=='SUMMARY')animate(child,[{opacity:0},{opacity:1}]);},true);
motionChoice=localStorage.getItem('motion')==='reduced'?'reduced':'system';syncMotion();draw();lock();
new QWebChannel(qt.webChannelTransport,channel=>{
 bridge=channel.objects.console;
 bridge.telemetryChanged.connect(text=>updateTelemetry(JSON.parse(text)));
 bridge.telemetry();
 bridge.answer.connect(text=>{const answer=JSON.parse(text),task=waiting.get(answer.id);if(!task)return;waiting.delete(answer.id);pending=Math.max(0,pending-1);answer.ok?task.resolve(answer.value):task.reject(Error(answer.error));});
 bridge.locked.connect(()=>{for(const task of waiting.values())task.reject(Error('The local session is locked.'));waiting.clear();pending=0;if(!locked)lock();});
 setInterval(()=>{if(!locked&&!pending&&overlay.hidden)refresh(page==='Overview').catch(error=>{root.querySelector('#node-label').textContent='Status unavailable · retrying';});},10000);
});

})();
</script></body></html>
