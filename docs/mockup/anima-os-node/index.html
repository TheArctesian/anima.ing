 const before=priorMotionState;

 // Private content has already been removed before any arrival starts.

}

    paint();
    if(now<settleAt||Math.abs(x-target)>.001||Math.abs(velocity)>.001)frame=requestAnimationFrame(tick);
    else stop();
  }
  function transition(kind){
    if(reducedMotion()||document.hidden){stop();return;}
    // A finite outward passage followed by a return to the same brand landmark.
    // Lock closes the current field; at rest use a restrained opening before closure.
    target=kind==='unlock'?.85:.3;
    last=performance.now();settleAt=last+(kind==='unlock'?300:120);
    if(!frame)frame=requestAnimationFrame(tick);
  }
  function redraw(){field.resize();field.layout([{x:0,y:0,width:canvas.clientWidth,height:canvas.clientHeight}],1);paint();}
  new ResizeObserver(redraw).observe(canvas);
  window.addEventListener('node-motion',e=>{if(e.detail.changed)transition(e.detail.kind);});
  preference.addEventListener('change',()=>{if(reducedMotion())stop();});
  new MutationObserver(()=>{if(reducedMotion())stop();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-motion']});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
  redraw();
})();
</script></body></html>
