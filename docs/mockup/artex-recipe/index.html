<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARTEX catalogue recipe mockups</title>
<style>
/* Layout: a review board for the ARTEX entry in the existing Catalogue choice
   (hosted-applications-plan.md HOST-053, task H43; device-containers-v2 Frames 3 to 6).
   Frame 1 is the list with ARTEX selected (dark). Frame 2 is the description and Compose file (light).
   Frame 3 is the entry while it waits for a digest (dark). Not approved. No font, script or image
   comes from a third party. */
:root {
  color-scheme: dark;
  --pg-bg: #101214; --pg-fg: #E6E7E9; --pg-muted: #A4A8B0; --pg-rule: #2C3036;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light; --pg-bg: #E6E8EB; --pg-fg: #1D2024; --pg-muted: #5A5F68; --pg-rule: #C9CDD3;
} }
.gd {
  --surface-base: #1B1D21; --surface-raised: #23262B; --surface-hover: #2A2D33; --border-subtle: #34383E; --border-strong: #6C7076;
  --text: #E6E7E9; --text-secondary: #A4A8B0; --accent: #88C0D0;
  --status-up: #A3BE8C; --status-down: #BF616A; --status-degraded: #EBCB8B; --status-maintenance: #B48EAD; --status-unknown: #7B8089;
}
.gl {
  --surface-base: #F6F7F8; --surface-raised: #FFFFFF; --surface-hover: #ECEEF0; --border-subtle: #D8DBDF; --border-strong: #86898E;
  --text: #1D2024; --text-secondary: #5A5F68; --accent: #2E6E80;
  --status-up: #4F7A3A; --status-down: #A8424C; --status-degraded: #9A7215; --status-maintenance: #B48EAD; --status-unknown: #7B8089;
}
.gd, .gl {
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-6: 1.5rem; --space-8: 2rem;
  --text-sm: 0.8125rem; --text-md: 0.875rem; --text-lg: 1rem; --text-display: 2.25rem;
  --leading-tight: 1.2; --leading-normal: 1.5; --tracking-tight: -0.03em;
  --weight-light: 200; --weight-medium: 500; --radius-md: 4px; --radius-pill: 999px; --border-thin: 1px;
  --control-sm: 1.75rem; --control-md: 2rem;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px 48px; background: var(--pg-bg); color: var(--pg-fg); font-family: var(--font-ui); }
h1.board { margin: 0 0 4px; font-weight: 200; font-size: 28px; }
p.about { margin: 0 0 24px; color: var(--pg-muted); font-size: 14px; max-width: 78ch; }
.frames { display: grid; gap: 32px; }
figure { margin: 0; }
figcaption { margin-top: 6px; font-size: 12px; color: var(--pg-muted); max-width: 90ch; }
.frame { max-inline-size: 1040px; border: var(--border-thin) solid var(--pg-rule); background: var(--surface-base); color: var(--text); font-size: var(--text-md); }
.app { display: grid; grid-template-columns: 13rem 1fr; min-block-size: 32rem; }
.side { border-inline-end: var(--border-thin) solid var(--border-subtle); padding: var(--space-6) var(--space-4); display: grid; gap: var(--space-2); align-content: start; }
.nav { color: var(--text-secondary); } .nav.on { color: var(--text); font-weight: var(--weight-medium); }
.group { font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary); margin-block-start: var(--space-3); }
.main { display: grid; grid-template-rows: auto 1fr; min-block-size: 32rem; }
.bar { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-4) var(--space-6); border-block-end: var(--border-thin) solid var(--border-subtle); }
.bar h2 { margin: 0; font-weight: var(--weight-medium); font-size: var(--text-lg); }
.choice { display: grid; grid-template-columns: 18rem 1fr; min-block-size: 28rem; }
.list { border-inline-end: var(--border-thin) solid var(--border-subtle); padding: var(--space-4); display: grid; align-content: start; gap: var(--space-2); }
.search { block-size: var(--control-md); padding: 0 var(--space-3); border: var(--border-thin) solid var(--border-subtle); border-radius: var(--radius-md); color: var(--text-secondary); background: var(--surface-raised); }
.row { padding: var(--space-3); border-radius: var(--radius-md); display: grid; gap: 2px; }
.row.on { background: var(--surface-hover); }
.name { font-weight: var(--weight-medium); }
.meta { color: var(--text-secondary); font-size: var(--text-sm); }
.pane { padding: var(--space-6); display: grid; align-content: start; gap: var(--space-4); }
.head { display: flex; justify-content: space-between; gap: var(--space-4); align-items: start; }
h3 { margin: 0; font-size: 1.25rem; font-weight: var(--weight-medium); }
.btn { display: inline-flex; align-items: center; block-size: var(--control-sm); padding: 0 var(--space-3); border: var(--border-thin) solid var(--border-strong); border-radius: var(--radius-md); font-size: var(--text-sm); }
.btn.pri { background: var(--accent); color: var(--surface-base); border-color: var(--accent); }
.btn[aria-disabled="true"] { opacity: 0.55; }
.chip { display: inline-block; padding: 0 var(--space-2); border-radius: var(--radius-pill); border: var(--border-thin) solid var(--border-subtle); font-size: 0.75rem; color: var(--text-secondary); }
.facts { display: grid; grid-template-columns: 9rem 1fr; gap: var(--space-2) var(--space-4); font-size: var(--text-sm); }
.facts dt { color: var(--text-secondary); margin: 0; }
.facts dd { margin: 0; }
.muted { color: var(--text-secondary); font-size: var(--text-sm); }
code, pre { font-family: var(--font-mono); font-size: 0.8125rem; }
pre { margin: 0; padding: var(--space-4); background: var(--surface-raised); border: var(--border-thin) solid var(--border-subtle); border-radius: var(--radius-md); overflow: auto; white-space: pre-wrap; }
.note { padding: var(--space-4); border-inline-start: 3px solid var(--status-degraded); background: var(--surface-raised); display: grid; gap: var(--space-1); }
</style>
</head>
<body>
<h1 class="board">ARTEX catalogue recipe</h1>
<p class="about">The ARTEX entry uses the Catalogue choice that already exists on the Containers tab. It is not a new screen. Not approved. HOST-053 waits for OD-HOST-59 to OD-HOST-64. Install waits for task H6.</p>
<div class="frames">

<figure>
<div class="frame gd">
  <div class="app">
    <div class="side">
      <div class="nav">Overview</div>
      <div class="nav on">Containers</div>
      <div class="nav">Hosting</div>
      <div class="group">Machine</div>
      <div class="nav">workshop</div>
    </div>
    <div class="main">
      <div class="bar"><h2>Containers</h2><span class="chip">Catalogue</span><span class="muted">First party</span></div>
      <div class="choice">
        <div class="list">
          <div class="search">Search apps</div>
          <div class="row"><div class="name">Dawarich</div><div class="meta">1.23.0 · location</div></div>
          <div class="row on"><div class="name">ARTEX</div><div class="meta">Pending pin · security</div></div>
          <div class="row"><div class="name">OwnTracks Recorder</div><div class="meta">1.0.7 · location</div></div>
          <div class="row"><div class="name">Uptime Kuma</div><div class="meta">2.5.12 · monitoring</div></div>
        </div>
        <div class="pane">
          <div class="head">
            <div>
              <h3>ARTEX</h3>
              <p class="muted">A self-hosted, LLM-driven penetration testing platform.</p>
            </div>
            <span class="btn pri" aria-disabled="true">Install</span>
          </div>
          <p class="muted">Install is refused until task H6 exists. The entry is listed only when each image is named by a digest.</p>
          <dl class="facts">
            <dt>Author</dt><dd>BaaRai</dd>
            <dt>Tags</dt><dd><span class="chip">security</span> <span class="chip">pentest</span></dd>
            <dt>Ports</dt><dd>8787 tcp and 8788 tcp on 127.0.0.1</dd>
            <dt>Database</dt><dd>PostgreSQL 16, bundled, named by digest</dd>
            <dt>Tested</dt><dd>Not tested on a machine</dd>
            <dt>Documentation</dt><dd>https://github.com/BaaRai/ARTEX</dd>
          </dl>
        </div>
      </div>
    </div>
  </div>
</div>
<figcaption>Frame 1. Dark. The Catalogue list with ARTEX selected. No authorised-testing notice. Ports stay on loopback. The Install button is present and refused until task H6.</figcaption>
</figure>

<figure>
<div class="frame gl">
  <div class="app">
    <div class="side">
      <div class="nav">Overview</div>
      <div class="nav on">Containers</div>
      <div class="nav">Hosting</div>
    </div>
    <div class="main">
      <div class="bar"><h2>Containers</h2><span class="chip">Catalogue</span></div>
      <div class="choice">
        <div class="list">
          <div class="search">Search apps</div>
          <div class="row on"><div class="name">ARTEX</div><div class="meta">v0.7.x · security</div></div>
        </div>
        <div class="pane">
          <div class="head">
            <div>
              <h3>ARTEX</h3>
              <p class="muted">A self-hosted, LLM-driven penetration testing platform. A planner splits a goal into intents, and workers run on a machine of yours.</p>
            </div>
            <span class="btn pri">Install on workshop</span>
          </div>
          <dl class="facts">
            <dt>Image</dt><dd>ghcr.io/baarai/artex@sha256:… (example pin)</dd>
            <dt>Ports</dt><dd>8787 web UI, 8788 recording proxy, both 127.0.0.1</dd>
            <dt>Volumes</dt><dd>data, keys (named volumes; no host skills mount)</dd>
            <dt>Variables</dt><dd>POSTGRES_PASSWORD (generated). Optional LLM keys.</dd>
          </dl>
          <pre>services:
  postgres:
    image: postgres@sha256:…   # official 16, digest pinned
    expose: ["5432"]
  artex:
    image: ghcr.io/baarai/artex@sha256:…
    security_opt: [no-new-privileges:true]
    ports:
      - { target: 8787, published: 8787, host_ip: 127.0.0.1, protocol: tcp }
      - { target: 8788, published: 8788, host_ip: 127.0.0.1, protocol: tcp }
    volumes:
      - { type: volume, source: data, target: /app/data }
      - { type: volume, source: keys, target: /app/keys }</pre>
        </div>
      </div>
    </div>
  </div>
</div>
<figcaption>Frame 2. Light. The description and the rewritten Compose file after a public digest exists. The official file is not used as-is: no build key, no short-form ports, no short bind mounts. The ellipsis in the digest is a placeholder; a real entry names 64 hexadecimal digits. The first-run setup token is read from the container log, not shown here.</figcaption>
</figure>

<figure>
<div class="frame gd">
  <div class="app">
    <div class="side">
      <div class="nav">Overview</div>
      <div class="nav on">Containers</div>
    </div>
    <div class="main">
      <div class="bar"><h2>Containers</h2><span class="chip">Catalogue</span></div>
      <div class="pane" style="padding: var(--space-8);">
        <h3>ARTEX is not listed yet</h3>
        <div class="note">
          <div class="name">Waiting for a published, digest-pinned image</div>
          <p class="muted">ghcr.io/baarai/artex has no public image at v0.7.0. The recipe may be on the branch, but the static test refuses a missing digest, so the hub does not list the entry (R-233, task H38). This is the path if OD-HOST-60 is No.</p>
        </div>
        <p class="muted">The other path, only if OD-HOST-60 is Yes, is a build from a pinned git commit of BaaRai/ARTEX, with the digest of the built image recorded before the entry is listed. R-233 is not relaxed.</p>
      </div>
    </div>
  </div>
</div>
<figcaption>Frame 3. Dark. The waiting state while no public digest exists. Recommended path: do not reopen R-214; list the entry when the first public GHCR digest exists.</figcaption>
</figure>

</div>
</body>
</html>
