[package]
name = "anima-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "anima_daemon"

[[bin]]
name = "anima-daemon"
path = "src/main.rs"

[features]
# THR-172: enable only after review of the real probe implementation.
mobile-inventory = []
# The integration tests start the daemon as a child of the test and call its runner as the
# person. On a system that keeps a read of that test from the daemon (the Mac runner of GitHub,
# 2026-11-23) the rule of R-315 fails closed and takes the test for an agent; with this feature
# the runner takes the process that started it for the person, unless that process carries the
# mark of a thread or is below the holder. Only the dev-dependency below turns it on, so each build
# of tests has it, also the debug `anima-daemon` that such a build leaves in `target/debug`; a
# release build refuses it (`threads::runner::peer`), so a shipped daemon never has it.
test-person = []

[dependencies]
# The protocols of the agent programs and the frames of the local socket of the runner.
agent-threads = { path = "../agent-threads" }
daemon-core = { path = "../daemon-core" }
# The account salt of the hub arrives in base64 (K8 Section 8.2).
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
# The spread of the retry wait (K8 Section 7) comes from the OS random source.
getrandom.workspace = true
# Plain `rustls-tls` (web PKI roots, no OpenSSL); no `cookies`, no `json`, no proxy support is
# used: the client turns the proxy off (MET-020, K8 Section 1).
reqwest.workspace = true
# `enrol -` reads the code with echo off when stdin is a terminal.
rpassword.workspace = true
# `install` reads a folder's POSIX ACL (an xattr) and opens the system token with
# O_NOFOLLOW | O_NONBLOCK | O_NOCTTY (MET-019). Safe wrappers: the workspace forbids `unsafe`, so
# raw `libc` calls are out. Already in Cargo.lock through tempfile.
serde.workspace = true
serde_json.workspace = true
# Model work (task L1-6): the SHA-256 of a runtime archive, and the unpack of its `.tar.gz`.
sha2.workspace = true
flate2 = "1"
tar = { version = "0.4", default-features = false }
# The `.zip` releases of llama.cpp (R-329); deflate only, through flate2.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tempfile.workspace = true
thiserror.workspace = true
# `process` runs the fixed read-only commands, `signal` ends the daemon on SIGTERM, `fs` reads /proc.
tokio = { workspace = true, features = ["process", "signal", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

# The macOS Keychain holds the daemon token (MET-013). Linux uses a 0600 file and never builds this.
[target.'cfg(target_os = "macos")'.dependencies]
keyring.workspace = true
# Inspect effective recovery permissions on the pinned directory descriptor.
calcifer-macos-acl = "=0.1.0"

[dev-dependencies]
anima-daemon = { path = ".", features = ["test-person"] }
tokio = { workspace = true, features = ["test-util"] }
daemon-core = { path = "../daemon-core", features = ["test-support"] }
axum.workspace = true
plist.workspace = true

[target.'cfg(windows)'.dependencies]
anima-windows = { path = "../anima-windows" }
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk", "network"] }
hyperlocal-with-windows = { version = "0.9", default-features = false, features = ["client"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util.workspace = true
http-body-util.workspace = true

[target.'cfg(unix)'.dependencies]
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
hmac.workspace = true
model-relay = { path = "../model-relay" }
redaction = { path = "../redaction" }
rustix = { version = "1.1", features = ["fs", "process", "thread"] }
# The holder marks each descriptor it inherited close-on-exec (THR-040): `fcntl` on a raw
# descriptor number, which rustix takes only through `unsafe`. Already in Cargo.lock.
nix = { version = "0.29", default-features = false, features = ["fs", "time"] }
# HTTP on the socket of the link, on a connection whose peer the daemon checked first (K8 Section 1).
hyper = { version = "1", features = ["client", "http1"] }
hyper-util.workspace = true
http-body-util.workspace = true

[target.'cfg(all(target_os = "linux", target_pointer_width = "64"))'.dependencies]
nix-peer = { package = "nix", version = "0.31", default-features = false, features = ["socket"] }
rustix = { version = "1.1", features = ["event"] }

[target.'cfg(windows)'.dev-dependencies]
uds_windows = "1.2"
