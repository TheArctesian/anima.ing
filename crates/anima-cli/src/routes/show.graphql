# `anima route show`: one public name with its state.
query RouteShow($id: ID!) {
  applicationRoute(id: $id) {
    id
    name
    kind
    access
    applicationId
    deviceId
    port
    listenPort
    protocol
    redirectTo
    proof
    failedReads
    proofRecordName
    proofRecordValue
    machineConsent
    certificateNotAfter
    waitsFor
    checkedAt
    requests
    bytesIn
    bytesOut
    refused
    createdAt
  }
}
