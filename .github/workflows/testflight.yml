name: TestFlight

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
  schedule:
    - cron: "13,33,53 * * * *"

permissions: {}

jobs:
  # The merge train pushes with GITHUB_TOKEN, which does not fan out push events.
  catch-up-dev:
    if: github.event_name == 'schedule' && vars.ANIMA_TESTFLIGHT_DEV == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Queue a build of dev when the merge train advances it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow testflight.yml \
              --branch dev --commit "$sha" --limit 10 --json conclusion \
              --jq '[.[] | select(.conclusion != "skipped" and .conclusion != "cancelled")] | length')
          if [[ "$runs" == 0 ]]; then gh workflow run testflight.yml --repo "$GITHUB_REPOSITORY" --ref dev; fi

  testflight:
    if: >-
      github.event_name != 'schedule' &&
      ((github.ref == 'refs/heads/dev' && vars.ANIMA_TESTFLIGHT_DEV == 'on') ||
      (github.ref == 'refs/heads/main' && vars.ANIMA_TESTFLIGHT_MAIN == 'on'))
    concurrency:
      group: testflight-upload
      cancel-in-progress: false
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
    environment:
      name: release
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
          no-cache: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: link/go.mod
          cache: false
      - name: Prepare the iOS build
        run: |
          set -eu
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $sdk"
          if ! [ "${sdk%%.*}" -ge 27 ]; then
            echo "::error::TestFlight requires the iOS 27 SDK or later."
            exit 1
          fi
          rustup target add aarch64-apple-ios
          brew install xcodegen
          bun install --frozen-lockfile
      - name: Sign the iOS archive
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash deploy/testflight/sign.sh
      - name: Upload and distribute to the branch's TestFlight group
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bash deploy/testflight/upload.sh
