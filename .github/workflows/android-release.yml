name: Android release

on:
  push:
    branches: [main]

concurrency:
  group: android-release-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gates:
    if: vars.ANIMA_PUBLIC_ANDROID == 'on'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/gates.yml
    with:
      ref: ${{ github.sha }}

  build:
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
          no-cache: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: link/go.mod
          cache: false
      - id: version
        name: Read Android release coordinates
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$(git rev-parse HEAD^1)" != "$BEFORE" ]; then
            echo "::error::The Android release requires main to advance by one first-parent commit."
            exit 1
          fi
          version=$(deploy/bin/commit-version HEAD)
          code=$(git rev-list --count --first-parent HEAD)
          {
            printf 'version=%s\n' "$version"
            printf 'code=%s\n' "$code"
            printf 'tag=android-%s+%s\n' "$version" "$code"
          } >> "$GITHUB_OUTPUT"
      - name: Build unsigned Android APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          CI: 'true'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openjdk-21-jdk-headless
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          rustup target add aarch64-linux-android
          apps/desktop/src-tauri/build-android-apk.sh "$VERSION" "$CODE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: target/android/Anima-unsigned.apk
          if-no-files-found: error
          overwrite: true
      - name: Prepare the F-Droid submission recipe
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p target/android/fdroid
          sed -e 's|^  - versionName: 0\.1\.0$|  - versionName: '"$VERSION"'|' \
            -e 's|^    versionCode: 1000$|    versionCode: '"$CODE"'|' \
            -e '/^    disable:/d' \
            -e 's|^    commit: FDROID_RELEASE_COMMIT$|    commit: '"$SHA"'|' \
            apps/desktop/fdroid/ing.anima.mobile.yml > target/android/fdroid/ing.anima.mobile.yml
          printf '\nCurrentVersion: %s\nCurrentVersionCode: %s\n' "$VERSION" "$CODE" \
            >> target/android/fdroid/ing.anima.mobile.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdroid-submission
          path: target/android/fdroid/ing.anima.mobile.yml
          if-no-files-found: error
          overwrite: true

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-android
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
      - name: Sign and verify the Android APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_CERTIFICATE_SHA256: ${{ vars.ANDROID_RELEASE_CERTIFICATE_SHA256 }}
          VERSION: ${{ needs.build.outputs.version }}
          CODE: ${{ needs.build.outputs.code }}
        run: |
          set -eu
          : "${ANDROID_KEYSTORE:?Configure the Android release keystore}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Configure the Android release keystore password}"
          : "${ANDROID_CERTIFICATE_SHA256:?Configure the Android release certificate fingerprint}"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdkmanager --sdk_root="$ANDROID_HOME" 'build-tools;36.0.0'
          tools="$ANDROID_HOME/build-tools/36.0.0"
          umask 077
          key=$(mktemp)
          trap 'unlink "$key"' EXIT
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$key"
          unset ANDROID_KEYSTORE
          "$tools/apksigner" sign --alignment-preserved --v4-signing-enabled false \
            --ks "$key" --ks-key-alias anima-android-release \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --in Anima-unsigned.apk --out Anima.apk
          unset ANDROID_KEYSTORE_PASSWORD
          certificate=$("$tools/apksigner" verify --print-certs Anima.apk |
            awk '/^Signer #1 certificate SHA-256 digest:/ { print $NF }')
          test "$certificate" = "$ANDROID_CERTIFICATE_SHA256"
          package=$("$tools/aapt" dump badging Anima.apk | grep '^package:')
          case "$package" in
            "package: name='ing.anima.mobile' versionCode='$CODE' versionName='$VERSION' "*) ;;
            *) echo '::error::Unexpected Android application ID or version.'; exit 1 ;;
          esac
          "$tools/zipalign" -c -P 16 4 Anima.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-signed
          path: Anima.apk
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-signed
      - name: Publish the Android release asset and tag
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          if ! gh release view "$TAG" --json isDraft,targetCommitish,assets > release.json; then
            gh release create "$TAG" --draft --target "$SHA" --latest=false \
              --title "Anima Android $VERSION" --notes "Android APK signed by Anima."
            gh release view "$TAG" --json isDraft,targetCommitish,assets > release.json
          fi
          if tag_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2>/dev/null); then
            test "$tag_sha" = "$SHA"
          else
            jq -e --arg sha "$SHA" '.isDraft and .targetCommitish == $sha' release.json >/dev/null
          fi
          if jq -e 'any(.assets[]; .name == "Anima.apk")' release.json >/dev/null; then
            gh release download "$TAG" --pattern Anima.apk --output published.apk
            cmp Anima.apk published.apk
          else
            jq -e '.isDraft' release.json >/dev/null
            gh release upload "$TAG" Anima.apk
          fi
          if jq -e '.isDraft' release.json >/dev/null; then
            gh release edit "$TAG" --draft=false --latest=false
          fi
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$SHA"
